name: Trading X PPO V4 Research
on:
  pull_request:
    paths:
      - 'tools/train_demo_ppo_v4.py'
      - 'tools/ppo_skill_curriculum_v4.py'
      - 'app/demo/ai_market_skills.py'
      - 'tests/test_ppo_market_skills_v4.py'
      - '.github/workflows/research-ppo-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-x-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  v4:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ai-v3.txt
      - run: python -m unittest tests.test_ppo_market_skills_v4 tests.test_ai_indicators_mtf tests.test_ppo_skill_curriculum -v
      - run: python -m tools.download_ai_candles --universe live --days 16 --min-symbols 10 --min-coverage 0.8 --output data/trading_x_v4_candles.csv --report data/trading_x_v4_coverage.json
      - run: python -m tools.train_demo_ppo_v4 --csv data/trading_x_v4_candles.csv --universe-report data/trading_x_v4_coverage.json --steps 96000 --output models/trading_x_ppo_v4_market_skills_research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-x-v4-research-unapproved
          path: |
            models/trading_x_ppo_v4_market_skills_research
            data/trading_x_v4_coverage.json
          retention-days: 14
          if-no-files-found: warn
