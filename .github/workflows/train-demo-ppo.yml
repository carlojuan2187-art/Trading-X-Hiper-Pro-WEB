name: Entrenar IA PPO DEMO (universo LIVE)
on:
  pull_request:
    paths:
      - '.github/workflows/train-demo-ppo.yml'
      - 'tools/download_ai_candles.py'
      - 'tools/train_demo_ppo.py'
      - 'tools/live_training_universe.py'
  workflow_dispatch:
    inputs:
      universe:
        description: "live = universo del scanner LIVE; explicit = pares personalizados"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - explicit
      symbols:
        description: "Solo para modo explicit; separado por coma"
        required: false
        default: ""
        type: string
      steps:
        description: "Pasos PPO (mínimo 20000)"
        required: true
        default: "100000"
        type: string
      days:
        description: "Días de velas 5m reales (máximo 17)"
        required: true
        default: "16"
        type: string
      leverage:
        description: "Apalancamiento de investigación alineado con DEMO"
        required: true
        default: "10"
        type: string
      margin_cap:
        description: "Margen USDC máximo para entrenar"
        required: true
        default: "25"
        type: string
      position_percent:
        description: "Fracción de balance dedicada a margen (0..1)"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

# One experiment per branch/PR. Superseded research jobs must not
# multiply data API calls or consume CPU hours concurrently.
concurrency:
  group: ppo-live-universe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  train-ppo:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar PyTorch CPU y PPO fuera de Railway
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu
          python -m pip install --disable-pip-version-check "stable-baselines3==2.6.0" "gymnasium>=1.1,<1.3" "numpy>=1.26,<3" "httpx>=0.25,<1"
      - name: Descargar mercado LIVE dinámico y velas reales
        env:
          UNIVERSE: ${{ inputs.universe || 'live' }}
          SYMBOLS: ${{ inputs.symbols || '' }}
          DAYS: ${{ inputs.days || '16' }}
        run: |
          if [ "$UNIVERSE" = "live" ]; then
            python -m tools.download_ai_candles --universe live --days "$DAYS" \
              --min-symbols 10 --min-coverage 0.8 \
              --output data/trading_x_real_5m.csv --report data/trading_x_live_universe.json
          else
            test -n "$SYMBOLS" || { echo "Explicit symbols required" >&2; exit 1; }
            python -m tools.download_ai_candles --universe explicit --symbols "$SYMBOLS" \
              --days "$DAYS" --output data/trading_x_real_5m.csv \
              --report data/trading_x_live_universe.json
          fi
      - name: Guardar auditoría de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-x-live-universe-coverage
          path: data/trading_x_live_universe.json
          retention-days: 14
          if-no-files-found: warn
      - name: Entrenar PPO y evaluar holdout por mercado
        env:
          UNIVERSE: ${{ inputs.universe || 'live' }}
          SYMBOLS: ${{ inputs.symbols || '' }}
          STEPS: ${{ github.event_name == 'pull_request' && '20000' || inputs.steps || '100000' }}
          LEVERAGE: ${{ inputs.leverage || '10' }}
          MARGIN_CAP: ${{ inputs.margin_cap || '25' }}
          POSITION_PERCENT: ${{ inputs.position_percent || '1.0' }}
        run: |
          if [ "$UNIVERSE" = "live" ]; then
            python -m tools.train_demo_ppo --csv data/trading_x_real_5m.csv \
              --symbols auto --universe-report data/trading_x_live_universe.json \
              --steps "$STEPS" --leverage "$LEVERAGE" --margin-cap "$MARGIN_CAP" \
              --position-percent "$POSITION_PERCENT" --output models/trading_x_ppo
          else
            python -m tools.train_demo_ppo --csv data/trading_x_real_5m.csv \
              --symbols "$SYMBOLS" --steps "$STEPS" --leverage "$LEVERAGE" \
              --margin-cap "$MARGIN_CAP" --position-percent "$POSITION_PERCENT" \
              --output models/trading_x_ppo
          fi
      - name: Guardar checkpoint NO aprobado (14 días)
        uses: actions/upload-artifact@v4
        with:
          name: trading-x-ppo-research-unapproved
          path: models/trading_x_ppo/
          retention-days: 14
          if-no-files-found: error
