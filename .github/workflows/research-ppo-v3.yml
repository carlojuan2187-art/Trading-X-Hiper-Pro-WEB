name: Investigar PPO v3 M5-M15-H1 y stops dinámicos
on:
  pull_request:
    paths:
      - 'app/demo/ai_indicators.py'
      - 'app/demo/ai_features.py'
      - 'app/demo/ai_ppo.py'
      - 'app/demo/ai_stop_management.py'
      - 'tools/train_demo_ppo_v3.py'
      - 'tools/ppo_skill_curriculum.py'
      - 'tests/test_ppo_skill_curriculum.py'
      - 'requirements-ai-v3.txt'
      - '.github/workflows/research-ppo-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maskable-ppo-v3:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install offline-only v3 training dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ai-v3.txt
      - name: Verify indicator alignment, stop protection and train-only curriculum
        run: python -m unittest tests.test_ai_indicators_mtf tests.test_ppo_skill_curriculum -v
      - name: Download real dynamic Light universe, 5m closed bars
        run: |
          python -m tools.download_ai_candles --universe live --days 16 \
            --min-symbols 10 --min-coverage 0.8 \
            --output data/trading_x_v3_candles.csv \
            --report data/trading_x_v3_coverage.json
      - name: Train independent MaskablePPO v3 and assess untouched chronological holdout
        run: |
          python -m tools.train_demo_ppo_v3 \
            --csv data/trading_x_v3_candles.csv \
            --universe-report data/trading_x_v3_coverage.json \
            --steps 20000 --leverage 10 --margin-cap 25 --position-percent 1.0 \
            --taker-fee-bps 5 --slippage-bps 2 \
            --output models/trading_x_ppo_v3_research
      - name: Upload complete research checkpoints never auto-deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-x-mtf-maskable-ppo-v3-unapproved
          path: |
            models/trading_x_ppo_v3_research/
            data/trading_x_v3_coverage.json
          if-no-files-found: warn
          retention-days: 14
