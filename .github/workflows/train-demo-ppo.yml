name: Entrenar IA PPO DEMO (manual)
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Pares reales separados por coma"
        required: true
        default: "BTC,ETH,SOL"
        type: string
      steps:
        description: "Pasos PPO (min 20000)"
        required: true
        default: "100000"
        type: string

permissions:
  contents: read

jobs:
  train-ppo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar PyTorch solo CPU (sin GPU/CUDA)
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu
          python -m pip install --disable-pip-version-check "stable-baselines3==2.6.0" "gymnasium>=1.1,<1.3" "numpy>=1.26,<3" "httpx>=0.25,<1"
      - name: Descargar velas reales (sin claves ni órdenes)
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          python tools/download_ai_candles.py --symbols "$SYMBOLS" --days 10 --output data/trading_x_real_5m.csv
      - name: Entrenar PPO y evaluar holdout separado
        env:
          SYMBOLS: ${{ inputs.symbols }}
          STEPS: ${{ inputs.steps }}
        run: |
          python tools/train_demo_ppo.py --csv data/trading_x_real_5m.csv --symbols "$SYMBOLS" --steps "$STEPS" --output models/trading_x_ppo
      - name: Guardar checkpoint NO aprobado (14 días)
        uses: actions/upload-artifact@v4
        with:
          name: trading-x-ppo-research-unapproved
          path: models/trading_x_ppo/
          retention-days: 14
          if-no-files-found: error
