name: DEMO scanner and entry regressions
on:
  pull_request:
    paths:
      - 'app/market_scanner.py'
      - 'app/trading_engine.py'
      - 'app/demo/simulator.py'
      - 'app/demo/ai_ppo.py'
      - 'tools/train_demo_ppo.py'
      - 'tools/download_ai_candles.py'
      - 'requirements-ai-train.txt'
      - 'app/demo/settings.py'
      - 'app/demo/worker.py'
      - 'app/strategies/liquidity_sweep_reversal.py'
      - 'app/demo/worker.py'
      - 'app/demo/audit.py'
      - 'app/strategies/breakout_reset.py'
      - 'app/web/static/market/market-terminal.js'
      - 'app/market/terminal.py'
      - 'app/web/static/brand-premium.css'
      - 'app/web/static/index.html'
      - 'app/web/static/app.js'
      - 'app/web/static/trade-share/**'
      - 'app/demo/ledger.py'
      - 'app/api/routes_admin.py'
      - 'tests/**'
      - 'tools/test_*offline.py'
      - '.github/workflows/demo-signal-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Archived strategy tests only. Production worker rejects legacy mode.
      DEMO_DECISION_ENGINE: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile autonomous AI and worker
        run: python -m compileall -q app/demo tools/train_demo_ppo.py tools/download_ai_candles.py
      - name: Scanner regression
        run: python tools/test_scanner_funnel_offline.py
      - name: Strategy contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: DEMO execution and risk isolation
        run: python tools/test_demo_offline.py
      - name: Chart legacy trade symbol regression
        run: node tests/test_market_terminal_aliases.cjs
      - name: Browser script syntax
        run: |
          node --check app/web/static/app.js
          node --check app/web/static/trade-share/share-trade.js
      - name: Share card unit and QR tests
        run: node --test tests/test_trade_share_phase5.mjs
      - name: Premium UI regressions
        run: node --test tests/test_premium_ui.cjs
      - name: Share card and Admin DEMO reset regression
        run: node tests/test_share_demo_admin.cjs
